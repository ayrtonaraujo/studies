<!DOCTYPE html>


<html lang="en">


<head>
    <link rel="icon" type="image/x-icon" href="img/favicon.png">

    <link rel="stylesheet" href="resistor-calc.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;1,100;1,200;1,300;1,400;1,500;1,600&display=swap"
        rel="stylesheet">



    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resistor Calculator</title>

</head>



<body>

    <div class="titleCalc">
        <h1>Resistor Calculator</h1>

    </div>


    <div class="workArea">

        <div class="inputArea">

            <div class="qtdSelectBtn">
                <button>4</button>
                <button>5</button>
                <button>6</button>
            </div>

            <div id="stripe_1_select">
                <p>Stripe 1</p>
                <select id="button-1">

                    <option value="Black">Black</option>
                    <option value="Brown">Brown</option>
                    <option value="Red">Red</option>
                    <option value="Orange">Orange</option>
                    <option value="Yellow">Yellow</option>
                    <option value="Green">Green</option>
                    <option value="Blue">Blue</option>
                    <option value="Violet">Violet</option>
                    <option value="Grey">Grey</option>
                    <option value="White">White</option>
                    <option value="White">Gold</option>
                    <option value="White">Silver</option>

                </select>
             </div>

        </div>


        <div class="imgArea">

            <img src="img/resistor-base.svg">
            
            <div class="stripes">
                <div id="stripe_1"></div>
                <div id="stripe_2"></div>
                <div id="stripe_3"></div>
                <div id="stripe_4"></div>
                <div id="stripe_5"></div>
                <div id="stripe_6"></div>
            </div>


        </div>


    </div>


</body>

</html>
